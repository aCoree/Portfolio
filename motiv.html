<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hell-/Dunkel-Modus: muss vor den Stylesheets laden (siehe theme.js) -->
    <script src="js/theme.js?v=1.3"></script>
    <title>Motiv | Aurelio Zingarello</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicons/favicon-192x192.png">

    <link rel="manifest" href="/favicons/site.webmanifest">

    <link rel="stylesheet" href="style.css?v=1.7">
    <link rel="stylesheet" href="css/az-reveal.css">
    <link rel="stylesheet" href="css/header.css?v=2.7">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        html,
        body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #ffffff;
        }

        /* ─── HAUPT-CONTAINER ─── */
        #foto-sub-page {
            width: 100%;
            max-width: 1400px;
            min-height: 60vh;
            margin: 0 auto;
            padding: 150px 40px 130px;
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            #foto-sub-page {
                padding: 120px 18px 90px;
            }
        }
    </style>
    <!-- Grossansicht (Lightbox): Aussehen zentral in css/lightbox.css -->
    <link rel="stylesheet" href="css/lightbox.css">
    <!-- Hell-Modus (greift nur bei html[data-theme="light"], siehe theme.css) -->
    <link rel="stylesheet" href="css/theme.css?v=1.8">
</head>

<body>

    <!-- PLATZHALTER FÜR HEADER & MOBILE MENÜ -->
    <div id="header-placeholder"></div>

    <main id="foto-sub-page">
        <div class="foto-sub-header page-header project-header">
            <a href="wildlife.html" class="foto-motiv-back az-reveal" id="foto-motiv-back">&#8592; <span
                    data-foto-back-label></span></a>
            <h1 class="az-reveal" data-az-delay="1" id="foto-motiv-title"></h1>
        </div>
        <div class="page-rule az-reveal" data-az-delay="1"></div>

        <!-- Titel, Zurück-Link und Raster werden von foto-galerie.js aus foto-data.js
             aufgebaut (Adresse: motiv.html?k=<kategorie>&m=<motiv>). Diese Seite
             gilt für ALLE Motive – pro Tier ist keine eigene Seite nötig. -->
        <div class="photo-mosaic az-reveal" data-az-delay="2" data-foto-motiv></div>
    </main>


    <!-- ─── ÜBERSETZUNGEN (MÜSSEN VOR SECOND-HEADER-KONFIG + HEADER.JS LADEN) ─── -->
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>

    <!-- ─── SECOND HEADER (Alle Fotos, Wildlife ▾, Street, …): gleich auf allen
         Fotografie-Seiten, kommt aus js/foto-nav.js (Motive aus foto-data.js) ─── -->
    <script src="js/foto-data.js"></script>
    <script src="js/foto-nav.js"></script>
    <script src="js/header.js?v=1.3"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/foto-galerie.js"></script>
    <script src="js/az-reveal.js"></script>
</body>

</html>
