<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motiv | Aurelio Zingarello</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">

    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="style.css?v=1.3">
    <link rel="stylesheet" href="az-reveal.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        html,
        body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #ffffff;
        }

        /* ─── HAUPT-CONTAINER ─── */
        #foto-sub-page {
            width: 100%;
            max-width: 1400px;
            min-height: 60vh;
            margin: 0 auto;
            padding: 150px 40px 130px;
            box-sizing: border-box;
        }

        /* Motiv-Seite: Zurück-Link über dem Titel (Titel + Linie wie auf allen Seiten,
           siehe .page-header / .page-rule in style.css). */
        .foto-motiv-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            font-size: 0.88rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 14px;
            transition: color 0.25s ease;
        }

        .foto-motiv-back:hover {
            color: #ffffff;
        }

        @media (max-width: 768px) {
            #foto-sub-page {
                padding: 120px 18px 90px;
            }
        }
    </style>
</head>

<body>

    <!-- PLATZHALTER FÜR HEADER & MOBILE MENÜ -->
    <div id="header-placeholder"></div>

    <main id="foto-sub-page">
        <div class="foto-sub-header page-header project-header">
            <a href="wildlife.html" class="foto-motiv-back az-reveal" id="foto-motiv-back">&#8592; <span
                    data-foto-back-label></span></a>
            <h1 class="az-reveal" data-az-delay="1" id="foto-motiv-title"></h1>
        </div>
        <div class="page-rule az-reveal" data-az-delay="1"></div>

        <!-- Titel, Zurück-Link und Raster werden von foto-galerie.js aus foto-data.js
             aufgebaut (Adresse: motiv.html?k=<kategorie>&m=<motiv>). Diese Seite
             gilt für ALLE Motive – pro Tier ist keine eigene Seite nötig. -->
        <div class="photo-mosaic az-reveal" data-az-delay="2" data-foto-motiv></div>
    </main>

    <!-- ─── GROSSANSICHT (LIGHTBOX) ─── -->
    <div id="photo-lightbox" class="photo-lightbox">
        <button class="lightbox-nav-btn lightbox-close-btn" id="lightbox-close" data-i18n-attr="aria-label:bts.close"
            aria-label="Schließen">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <button class="lightbox-nav-btn lightbox-prev-btn" id="lightbox-prev" data-i18n-attr="aria-label:bts.prevImage"
            aria-label="Vorheriges Bild">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="photo-lightbox-content"></div>
        <button class="lightbox-nav-btn lightbox-next-btn" id="lightbox-next" data-i18n-attr="aria-label:bts.nextImage"
            aria-label="Nächstes Bild">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>

    <!-- ─── ÜBERSETZUNGEN (MÜSSEN VOR SECOND-HEADER-KONFIG + HEADER.JS LADEN) ─── -->
    <script src="translations.js"></script>
    <script src="i18n.js"></script>

    <!-- ─── SECOND-HEADER-KONFIGURATION (IDENTISCH AUF FOTOGRAFIE.HTML UND
         ALLEN KATEGORIESEITEN – VOLLQUALIFIZIERTE LINKS, DAMIT SIE VON JEDER
         DIESER SEITEN AUS FUNKTIONIEREN) ─── -->
    <script>
        const tr = (key, fallback) => (window.i18n && window.i18n.translate(key)) || fallback;
        window.secondHeaderItems = [
            { label: tr('fotografie.navWildlife', "Wildlife"), href: "fotografie.html#wildlife" },
            { label: tr('fotografie.navStreet', "Streetfotografie"), href: "fotografie.html#street" },
            { label: tr('fotografie.navLandschaften', "Landschaften"), href: "fotografie.html#landschaften" },
            { label: tr('fotografie.navPortrait', "Portrait"), href: "fotografie.html#portrait" }
        ];
    </script>

    <script src="header.js"></script>
    <script src="photo-lightbox.js"></script>
    <script src="foto-data.js"></script>
    <script src="foto-galerie.js"></script>
    <script src="az-reveal.js"></script>
</body>

</html>
