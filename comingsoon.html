<!DOCTYPE html>
<html lang="de-CH">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Aurelio Zingarello</title>
    <meta name="robots" content="noindex, follow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link rel="preload" as="image" href="images/run-banner.jpg">
    <link rel="preload" as="image" href="images/hero-bg.jpg">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">

    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="style.css?v=1.3">
    <link rel="stylesheet" href="az-reveal.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="glow-page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* Hintergrund (Lichtkreise) + Vollbild-Bereich: siehe glow-page.css */
        .coming-soon {
            width: 100%;
        }

        .coming-soon h1 {
            margin: 0 !important;
            padding: 0 !important;

            font-family: "Anton", sans-serif !important;
            font-size: clamp(70px, 12vw, 180px);
            font-weight: 400;
            line-height: 0.9;

            color: #ffffff !important;
            text-align: center !important;
        }

        .coming-soon p {
            margin: 25px 0 0 !important;
            padding: 0 !important;

            font-family: "Roboto", sans-serif !important;
            font-size: 16px;
            font-weight: 400;

            color: #bdbdbd !important;
            text-align: center !important;
        }

        /* Zurück zur Fotografie-Übersicht – gleiche Box-Optik wie die
           Sprachbuttons (siehe header.css .lang-switcher-btn). */
        .coming-soon .coming-soon-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 38px;
            padding: 10px 22px;
            font-family: "Barlow Condensed", sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .coming-soon .coming-soon-back:hover,
        .coming-soon .coming-soon-back:focus-visible {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body class="glow-page">

    <main class="coming-soon glow-hero">
        <h1 data-i18n="comingsoon.title">COMING SOON</h1>
        <p data-i18n="comingsoon.text">Fotografien werden bald veröffentlicht.</p>
        <a href="fotografie.html" class="coming-soon-back"><i class="fa-solid fa-chevron-left"></i> <span data-i18n="comingsoon.back">Zurück</span></a>
    </main>

    <!-- JavaScript -->
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
    <script src="header.js"></script>
    <script src="az-reveal.js"></script>

</body>

</html>
