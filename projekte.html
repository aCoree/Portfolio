<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurelio Zingarello | Projekte</title>

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <!-- Stylesheets & Fonts -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        /* ─── STICKY FOOTER & PAGE FADE-IN ─── */
        html {
            height: 100%;
            margin: 0;
        }

        @keyframes pageFadeIn {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.995);
                filter: brightness(0.44);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: brightness(1);
            }
        }

        body {
            animation: pageFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
            background-color: #0b0b0d;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }

        main.container {
            flex: 1 0 auto;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            box-sizing: border-box;
        }

        /* ─── HEADER & FILTER LAYOUT ─── */
        .projects-header-flex {
            padding: 110px 0 25px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .projects-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0;
            color: #ffffff;
        }

        .sort-filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sort-label {
            color: #888888;
            font-size: 0.88rem;
            font-weight: 400;
        }

        .custom-select {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .custom-select:hover,
        .custom-select:focus-visible {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.12);
        }

        .custom-select option {
            background-color: #121212;
            color: #ffffff;
        }

        /* ─── LINKSBÜNDIGES GRID ─── */
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
            justify-content: start;
            justify-items: start;
            text-align: left;
            padding-bottom: 60px;
        }

        .poster-card {
            width: 100%;
            margin: 0;
            text-align: left;
            display: block;
            text-decoration: none;
            border: none;
            outline: none;
            box-shadow: none;
        }

        .poster-card:hover, 
        .poster-card:focus-visible {
            text-decoration: none;
            outline: none;
        }

        .poster-img-wrapper {
            border: none;
            outline: none;
            width: 100%;
            aspect-ratio: 9 / 16;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .poster-card:hover .poster-img-wrapper,
        .poster-card:focus-visible .poster-img-wrapper {
            transform: scale(1.03);
        }

        /* ─── TITLE & META ─── */
        .poster-info-single {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: nowrap;
            overflow: hidden;
        }

        .poster-info-single .poster-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.2;
            color: #ffffff;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .poster-info-single .dot-separator {
            color: rgba(255, 255, 255, 0.45);
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1;
            user-select: none;
            flex-shrink: 0;
        }

        .poster-info-single .poster-meta {
            margin: 0;
            font-size: 0.9rem;
            color: #888888;
            line-height: 1.2;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        /* ─── MOBILE OPTIMIERUNGEN ─── */
        @media (max-width: 768px) {
            main.container {
                padding: 0 16px;
            }

            .projects-header-flex {
                padding: 90px 0 20px 0;
            }

            .projects-title {
                font-size: 1.75rem;
            }

            .sort-label {
                font-size: 0.8rem;
            }

            .custom-select {
                padding: 6px 10px;
                font-size: 0.8rem;
            }

            .poster-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px 8px;
            }

            .poster-img-wrapper {
                border-radius: 6px;
            }

            .poster-info-single {
                margin-top: 6px;
                gap: 2px;
                flex-direction: column;
                align-items: flex-start;
            }

            .poster-info-single .dot-separator {
                display: none;
            }

            .poster-info-single .poster-title {
                font-size: 0.75rem;
                white-space: normal;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
            }

            .poster-info-single .poster-meta {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <!-- PLATZHALTER FÜR HEADER & MOBILE MENÜ -->
    <div id="header-placeholder"></div>

    <!-- ─── MAIN CONTENT ─── -->
    <main class="container">
        
        <div class="projects-header-flex">
            <h1 class="projects-title">Alle Projekte</h1>
            
            <div class="sort-filter-group">
                <label for="sortSelect" class="sort-label">Sortieren nach:</label>
                <select id="sortSelect" class="custom-select">
                    <option value="neuste">Neuste zuerst</option>
                    <option value="beliebteste">Beliebteste</option>
                    <option value="aelteste">Älteste zuerst</option>
                    <option value="alphabetisch">Name (A–Z)</option>
                </select>
            </div>
        </div>

        <!-- ─── MOVIE GRID (3 SPALTEN AUF MOBILE, 9:16 FORMAT) ─── -->
        <div class="poster-grid" id="projectsContainer">
            
            <!-- Poster 1: RUN -->
            <a href="run.html" class="poster-card" data-date="2026-06-01" data-views="1500" data-title="RUN">
                <div class="poster-img-wrapper" style="background-image: url('images/run-banner.jpg');"></div>
                <div class="poster-info poster-info-single">
                    <h3 class="poster-title">RUN</h3>
                    <span class="dot-separator">·</span>
                    <span class="poster-meta">Action Kurzfilm</span>
                </div>
            </a>

            <!-- Weitere Film-Karten können hier eingefügt werden -->

        </div>

    </main>

    <!-- PLATZHALTER FÜR FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- ─── JAVASCRIPT EINBINDUNG ─── -->
    <script src="header.js"></script>

    <script>
        // Sortierungs-Funktion für die Projekte
        const sortSelect = document.getElementById('sortSelect');
        const container = document.getElementById('projectsContainer');

        sortSelect.addEventListener('change', () => {
            const cards = Array.from(container.children);
            const val = sortSelect.value;

            cards.sort((a, b) => {
                if (val === 'neuste') {
                    return new Date(b.dataset.date || 0) - new Date(a.dataset.date || 0);
                } else if (val === 'aelteste') {
                    return new Date(a.dataset.date || 0) - new Date(b.dataset.date || 0);
                } else if (val === 'beliebteste') {
                    return parseInt(b.dataset.views || 0, 10) - parseInt(a.dataset.views || 0, 10);
                } else if (val === 'alphabetisch') {
                    const titleA = a.dataset.title || a.querySelector('.poster-title')?.textContent || '';
                    const titleB = b.dataset.title || b.querySelector('.poster-title')?.textContent || '';
                    return titleA.localeCompare(titleB, 'de', { sensitivity: 'base' });
                }
            });

            cards.forEach(card => container.appendChild(card));
        });
    </script>
</body>
</html>
