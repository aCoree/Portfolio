<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Musik – Klaviervideos</title>

    <link rel="preload" as="image" href="cards/card-big-musik.jpg">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">

    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="style.css?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
        SICHERHEIT & BASIS
        ===================================================== */
        html {
            visibility: visible !important;
            opacity: 1 !important;
            scroll-behavior: auto;
        }

        body {
            visibility: visible !important;
            opacity: 1 !important;
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #ffffff;
        }

        /* =====================================================
        SCROLL-ANIMATION-BEREICH (HERO)
        Das Klavierbild bleibt fix stehen (position: fixed – bewegt
        sich NIE) und wird beim Runterscrollen dunkler, bevor es
        weich ausblendet.

        WICHTIG FÜR SPÄTERE ANPASSUNGEN:
        Die einzige Zahl, die du hier ändern musst, um zu steuern
        WANN die Liste erscheint, ist die "height" von
        .scroll-sequence weiter unten. Alles andere (wann das Bild
        dunkel wird, wann es verschwindet) berechnet sich im
        JavaScript automatisch als PROZENTSATZ davon – die Werte
        verschieben sich also immer automatisch mit und es kann nie
        mehr zu einem "Sprung" oder einer sichtbaren Kante kommen,
        egal welche Zahl du hier einträgst.
        - Kleinere Zahl = Liste erscheint früher
        - Größere Zahl = Liste erscheint später / mehr Zeit für den
          Dunkel-Effekt
        ===================================================== */
        .scroll-sequence {
            position: relative;
            height: 170vh;
            width: 100%;
            background-color: #0d0d0d;
        }

        .sticky-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #0d0d0d;
            z-index: 1;
        }

        .musik-hero-picture {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .musik-hero-img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            object-position: center !important;
            border-radius: 0 !important;
            margin: 0 !important;
        }

        /* Permanente, gleichmäßige Vignette: gleicht ungleichmäßige
           Belichtung im Originalfoto aus (z.B. links dunkler / rechts
           heller) und sorgt dafür, dass ALLE Ränder – oben, unten,
           links, rechts – gleich weich ins Schwarz übergehen. Das ist
           IMMER aktiv, unabhängig vom Scroll-Fade darunter. */
        .hero-vignette {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background:
                /* Gleicht die HELLERE rechte Bildhälfte (weiße Tasten) an
                   die dunklere linke Hälfte (schwarze Tasten) an – mit
                   feinen Zwischenstufen für einen weichen, stufenlosen
                   Verlauf statt eines harten Übergangs. */
                linear-gradient(115deg,
                    rgba(13, 13, 13, 0) 0%,
                    rgba(13, 13, 13, 0.06) 20%,
                    rgba(13, 13, 13, 0.16) 40%,
                    rgba(13, 13, 13, 0.32) 60%,
                    rgba(13, 13, 13, 0.48) 80%,
                    rgba(13, 13, 13, 0.6) 100%),
                radial-gradient(ellipse 130% 110% at 50% 42%,
                    rgba(13, 13, 13, 0) 30%,
                    rgba(13, 13, 13, 0.12) 55%,
                    rgba(13, 13, 13, 0.3) 75%,
                    rgba(13, 13, 13, 0.55) 100%),
                linear-gradient(to bottom,
                    rgba(13, 13, 13, 0) 45%,
                    rgba(13, 13, 13, 0.15) 65%,
                    rgba(13, 13, 13, 0.4) 82%,
                    rgba(13, 13, 13, 0.85) 100%),
                rgba(13, 13, 13, 0.1);
        }

        /* Scroll-abhängiger Dunkel-Fade: legt sich gleichmäßig über das
           GESAMTE Bild (inkl. Vignette), macht es beim Scrollen also
           komplett und gleichmäßig dunkler – keine ungleichen Stellen
           mehr sichtbar, da hier flächendeckend Schwarz draufgelegt wird. */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            opacity: 0;
            z-index: 3;
            pointer-events: none;
        }

        /* =====================================================
        HAUPT-CONTAINER (alle Songs – inkl. The Force Theme)
        ===================================================== */
        #musik-page {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: relative !important;
            z-index: 10 !important;
            background-color: #0d0d0d !important;
            width: 100% !important;
            max-width: 1400px !important;
            margin: 0 auto !important;
            padding: 60px 40px 130px !important;
            box-sizing: border-box !important;
        }

        #musik-page *,
        #musik-page *::before,
        #musik-page *::after {
            box-sizing: border-box !important;
        }

        /* =====================================================
        VIDEO-BEREICH
        ===================================================== */
        .musik-section {
            display: block !important;
            visibility: visible !important;
            width: 100% !important;
            margin: 0 0 120px 0 !important;
            padding: 0 !important;
        }

        #musik-page>.musik-section:last-child {
            margin-bottom: 0 !important;
        }

        /* =====================================================
        REVEAL-ANIMATION (kommt von unten nach oben rein)
        Gilt jetzt für ALLE Songs gleichermassen –
        The Force Theme, Interstellar und Pirates verhalten
        sich exakt identisch, damit nichts "abgetrennt" wirkt.
        ===================================================== */
        .musik-section.reveal {
            opacity: 0;
            transform: translateY(90px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
                transform 1s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .musik-section.reveal.in-view {
            opacity: 1;
            transform: translateY(0);
        }

        /* =====================================================
        THEMATISCHE HINTERGRUND-BLOBS (verschwommen, cinematic)
        ===================================================== */
        .musik-section.themed-bg {
            position: relative !important;
            isolation: isolate;
        }

        .musik-section.themed-bg::before {
            content: "";
            position: absolute;
            inset: -12% -10%;
            z-index: -1;
            filter: blur(130px);
            opacity: 0.4;
            pointer-events: none;
            border-radius: 50%;
            transition: opacity 0.6s ease;
        }

        /* Star Wars (The Force Theme) – blau / hellblau / grünlich, Lichtschwert-mässig */
        .theme-starwars::before {
            background:
                radial-gradient(circle at 25% 30%, rgba(61, 220, 255, 0.9) 0%, transparent 55%),
                radial-gradient(circle at 75% 65%, rgba(41, 255, 176, 0.75) 0%, transparent 55%),
                radial-gradient(circle at 50% 50%, rgba(20, 90, 160, 0.6) 0%, transparent 70%);
        }

        /* Interstellar – violett */
        .theme-interstellar::before {
            background:
                radial-gradient(circle at 70% 35%, rgba(176, 107, 255, 0.85) 0%, transparent 55%),
                radial-gradient(circle at 30% 70%, rgba(123, 47, 247, 0.7) 0%, transparent 55%),
                radial-gradient(circle at 50% 50%, rgba(60, 20, 100, 0.6) 0%, transparent 70%);
        }

        /* Pirates of the Caribbean – orange / rot */
        .theme-pirates::before {
            background:
                radial-gradient(circle at 35% 40%, rgba(255, 145, 71, 0.85) 0%, transparent 55%),
                radial-gradient(circle at 70% 70%, rgba(255, 59, 31, 0.75) 0%, transparent 55%),
                radial-gradient(circle at 50% 50%, rgba(90, 15, 10, 0.6) 0%, transparent 70%);
        }

        /* =====================================================
        ANIMIERTE GRADIENT-TITEL
        ===================================================== */
        .musik-info h2.gradient-title {
            background-size: 200% auto !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            color: transparent !important;
            -webkit-text-fill-color: transparent !important;
            animation: gradientMove 7s ease-in-out infinite alternate;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .theme-starwars .gradient-title {
            background-image: linear-gradient(90deg, #3ddcff, #29ffb0, #8ff0ff, #3ddcff) !important;
        }

        .theme-interstellar .gradient-title {
            background-image: linear-gradient(90deg, #b06bff, #7b2ff7, #d6b3ff, #b06bff) !important;
        }

        .theme-pirates .gradient-title {
            background-image: linear-gradient(90deg, #ff9147, #ff3b1f, #ffd08a, #ff9147) !important;
        }

        /* =====================================================
        2-SPALTEN LAYOUT
        ===================================================== */
        .musik-two-column {
            display: grid !important;
            grid-template-columns: minmax(0, 1.65fr) minmax(280px, 0.75fr) !important;
            align-items: center !important;
            column-gap: 70px !important;
            row-gap: 50px !important;
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .musik-two-column.reverse {
            grid-template-columns: minmax(280px, 0.75fr) minmax(0, 1.65fr) !important;
        }

        /* =====================================================
        MEDIA CONTAINER
        ===================================================== */
        .musik-media {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: relative !important;
            width: 100% !important;
            min-width: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: visible !important;
        }

        #musik-page img {
            visibility: visible !important;
            opacity: 1 !important;
            max-width: 100% !important;
            border: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* =====================================================
        INFO-BEREICH
        ===================================================== */
        .musik-info {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            width: 100% !important;
            max-width: 470px !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .musik-info-label {
            display: block !important;
            visibility: visible !important;
            opacity: 0.55 !important;
            margin: 0 0 18px 0 !important;
            padding: 0 !important;
            font-family: inherit !important;
            font-size: 13px !important;
            font-weight: 800 !important;
            line-height: 1.2 !important;
            letter-spacing: 0.12em !important;
            text-transform: uppercase !important;
            color: inherit !important;
        }

        .musik-info h2 {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            margin: 0 0 22px 0 !important;
            padding: 0 !important;
            font-family: inherit !important;
            font-size: clamp(34px, 4vw, 60px) !important;
            font-weight: 900 !important;
            line-height: 1 !important;
            letter-spacing: -0.04em !important;
            color: inherit !important;
        }

        .musik-info-description {
            display: block !important;
            visibility: visible !important;
            opacity: 0.75 !important;
            margin: 0 0 30px 0 !important;
            padding: 0 !important;
            font-family: inherit !important;
            font-size: 16px !important;
            font-weight: 400 !important;
            line-height: 1.75 !important;
            color: inherit !important;
        }

        /* =====================================================
        DETAILS & VIDEO & GRID
        ===================================================== */
        .musik-details {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            width: 100% !important;
            margin: 25px 0 0 0 !important;
            padding: 0 !important;
            list-style: none !important;
        }

        .musik-details li {
            display: flex !important;
            justify-content: space-between !important;
            align-items: flex-start !important;
            width: 100% !important;
            margin: 0 !important;
            padding: 13px 0 !important;
            border-top: 1px solid currentColor !important;
            color: inherit !important;
        }

        .musik-details li:last-child {
            border-bottom: 1px solid currentColor !important;
        }

        .musik-detail-name {
            display: block !important;
            font-family: inherit !important;
            font-size: 12px !important;
            font-weight: 800 !important;
            line-height: 1.4 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.08em !important;
            opacity: 0.55 !important;
        }

        .musik-detail-value {
            display: block !important;
            max-width: 55% !important;
            font-family: inherit !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            line-height: 1.4 !important;
            text-align: right !important;
            color: inherit !important;
        }

        .musik-video {
            position: relative !important;
            display: block !important;
            width: 100% !important;
            aspect-ratio: 16 / 9 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: transparent !important;
            border-radius: 12px !important;
        }

        .musik-video iframe {
            position: absolute !important;
            display: block !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        .musik-videos-grid {
            display: grid !important;
            grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
            gap: 22px !important;
            width: 100% !important;
            margin: 0 0 55px 0 !important;
            padding: 0 !important;
        }

        .musik-video-item {
            display: block !important;
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: visible !important;
        }

        .musik-video-item .musik-video {
            border-radius: 8px !important;
        }

        .musik-video-item span {
            display: block !important;
            margin-top: 14px !important;
            font-family: inherit !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            opacity: 0.8 !important;
        }

        .musik-videos-info {
            display: block !important;
            width: 100% !important;
            max-width: 700px !important;
            margin: 0 !important;
            padding: 0 !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        /* =====================================================
        RESPONSIVE (UNTER 1100PX & TABLET/MOBILE)
        ===================================================== */
        @media (max-width: 1099px) {
            .musik-hero-img {
                object-fit: cover !important;
                object-position: center center !important;
            }
        }

        @media (max-width: 900px) {
            #musik-page {
                padding: 40px 25px 90px !important;
            }

            .musik-section {
                margin-bottom: 90px !important;
            }

            .musik-two-column,
            .musik-two-column.reverse {
                display: flex !important;
                flex-direction: column !important;
                column-gap: 0 !important;
                row-gap: 28px !important;
            }

            .musik-two-column .musik-info,
            .musik-two-column.reverse .musik-info {
                order: 1 !important;
            }

            .musik-two-column .musik-media,
            .musik-two-column.reverse .musik-media {
                order: 2 !important;
            }

            .musik-info {
                max-width: 100% !important;
            }
        }

        @media (max-width: 600px) {
            #musik-page {
                padding: 30px 18px 70px !important;
            }

            .musik-videos-grid {
                grid-template-columns: 1fr !important;
                gap: 15px !important;
                margin-bottom: 40px !important;
            }

            .musik-info h2 {
                font-size: 40px !important;
            }

            .musik-details li {
                gap: 12px !important;
            }

            .musik-detail-name,
            .musik-detail-value {
                font-size: 11px !important;
            }
        }

        /* Reduzierte Bewegung für Nutzer, die das bevorzugen */
        @media (prefers-reduced-motion: reduce) {
            .musik-section.reveal {
                opacity: 1 !important;
                transform: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div id="header-placeholder"></div>

    <div class="scroll-sequence">

    <main id="musik-page">

        <section class="musik-section themed-bg theme-starwars reveal">

                    <h2 class="gradient-title">INTERSTELLAR</h2>

                </div>
                <div class="musik-media">
                    <!-- TODO: YouTube-Embed-Link von Video 2 einsetzen -->

                        <iframe src="https://www.youtube.com/embed/VIDEO_ID_2" title="Klaviervideo 2"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

                    <div class="musik-video">
                        <iframe src="https://www.youtube.com/embed/VIDEO_ID_3" title="Klaviervideo 3"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
                <div class="musik-info">
                    <span class="musik-info-label">03 / Piano </span>

    </main>

    <div id="footer-placeholder"></div>

    <script src="header.js"></script>

    <script>
        // ==========================================================
        // HERO-EFFEKT: sauber & selbst-synchronisierend
        //
        // Statt fixer Pixel-/vh-Werte, die man bei jeder Änderung von
        // Hand aufeinander abstimmen muss, arbeitet dieser Code mit
        // einem einzigen Fortschritts-Wert (0 -> 1), der sich aus der
        // TATSÄCHLICHEN Höhe von .scroll-sequence berechnet. Das
        // bedeutet: egal welche "height" du oben bei .scroll-sequence
        // einstellst – Verdunkeln und Ausblenden passen sich IMMER
        // automatisch proportional an. Kein manuelles Nachjustieren
        // mehr nötig, kein Sprung, keine sichtbare Kante mehr möglich.
        // ==========================================================
        const heroContainer = document.querySelector('.sticky-container');
        const heroOverlay = document.querySelector('.hero-overlay');
        const scrollSequence = document.querySelector('.scroll-sequence');

        // Ab hier: bei Bedarf anpassen (als Anteil 0–1 der gesamten
        // Scroll-Sequence-Höhe).
        // DARK_END     = Punkt, an dem das Bild komplett schwarz ist
        // VANISH_START = Punkt, an dem das Bild ZUSÄTZLICH anfängt zu
        //                verschwinden (bewusst VOR DARK_END, dadurch
        //                überlappen sich "dunkler werden" und
        //                "verschwinden" – genau wie im urbnvibe-Vorbild.
        //                Das wirkt smoother/weniger "gestuft", weil nicht
        //                erst das eine komplett fertig sein muss, bevor
        //                das nächste beginnt.)
        // VANISH_END   = Punkt, an dem das Bild komplett unsichtbar ist
        // (muss immer < 1 sein, damit vor Erscheinen der Liste noch
        // Puffer bleibt – 0.9 lässt bewusst ca. 10% Sicherheitsabstand,
        // damit die Liste spürbar schneller erscheint als vorher)
        const DARK_END = 0.5;
        const VANISH_START = 0.22;
        const VANISH_END = 0.9;

        // Sanfte Ease-Kurve statt linearem Verlauf – wirkt organischer
        // und "cleaner" als eine 1:1 Kopplung an die Scroll-Position.
        function smoothstep(edge0, edge1, x) {
            let t = (x - edge0) / (edge1 - edge0);
            if (t < 0) t = 0;
            if (t > 1) t = 1;
            return t * t * (3 - 2 * t);
        }

        let totalScrollRange = 1;

        function measure() {
            if (!scrollSequence) return;
            // Strecke, während der der Hero-Bereich die volle Ansicht
            // einnimmt, bevor die Liste von unten hereinkommt.
            totalScrollRange = Math.max(
                scrollSequence.offsetHeight - window.innerHeight,
                1
            );
        }

        function updateHero() {
            const progress = window.scrollY / totalScrollRange;

            const darkProgress = smoothstep(0, DARK_END, progress);
            if (heroOverlay) {
                heroOverlay.style.opacity = darkProgress;
            }

            const vanishProgress = smoothstep(VANISH_START, VANISH_END, progress);
            const heroOpacity = 1 - vanishProgress;

            if (heroContainer) {
                heroContainer.style.opacity = heroOpacity;
                // Komplett unsichtbar: auch aus dem Rendering-/
                // Interaktionsfluss nehmen, damit garantiert nichts
                // mehr durchschimmern oder Klicks abfangen kann.
                if (heroOpacity <= 0) {
                    heroContainer.style.visibility = 'hidden';
                    heroContainer.style.pointerEvents = 'none';
                } else {
                    heroContainer.style.visibility = 'visible';
                    heroContainer.style.pointerEvents = 'auto';
                }
            }
        }

        // requestAnimationFrame-Throttling: verhindert Ruckeln, da die
        // Berechnung nie öfter als einmal pro Frame läuft.
        let tickScheduled = false;
        function onScroll() {
            if (!tickScheduled) {
                tickScheduled = true;
                requestAnimationFrame(() => {
                    updateHero();
                    tickScheduled = false;
                });
            }
        }

        measure();
        updateHero();
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', () => {
            measure();
            updateHero();
        });

        // 2. Alle Songs (The Force Theme, Interstellar, Pirates) kommen
        // beim Reinscrollen einheitlich von unten nach oben rein –
        // exakt der gleiche Effekt für jeden einzelnen Song, damit
        // nichts wie ein eigenes, abgetrenntes Element wirkt.
        const revealSections = document.querySelectorAll('.musik-section.reveal');

        if ('IntersectionObserver' in window) {
            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in-view');
                        revealObserver.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: '0px 0px 0px 0px'
            });

            revealSections.forEach((section) => revealObserver.observe(section));
        } else {
            // Fallback ohne IntersectionObserver: einfach direkt anzeigen
            revealSections.forEach((section) => section.classList.add('in-view'));
        }
    </script>

</body>

</html>
