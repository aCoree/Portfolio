<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hell-/Dunkel-Modus: muss vor den Stylesheets laden (siehe theme.js) -->
    <script src="js/theme.js?v=1.3"></script>
    <title>404 – Seite nicht gefunden | Aurelio Zingarello</title>

    <!-- Favicons für Browser, iOS und Android -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">

    <!-- Hochauflösendes Icon speziell für Google-Suchergebnisse -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicons/favicon-192x192.png">

    <!-- Web Manifest für mobile Verknüpfungen -->
    <link rel="manifest" href="/favicons/site.webmanifest">

    <!-- Diese Seite wird vom Hosting für JEDE nicht existierende URL
         ausgeliefert, auch für scheinbar "verschachtelte" Pfade wie
         /run/irgendwas – die Adresszeile behält dabei diesen (nicht
         existierenden) Pfad. <base href="/"> sorgt dafür, dass JEDER
         relative Pfad auf dieser Seite (auch von header.js dynamisch
         erzeugte Links/Bilder) trotzdem relativ zur Domain-Wurzel aufgelöst
         wird, statt fälschlich relativ zur URL in der Adresszeile. Dadurch
         bleiben ganz normale relative Pfade möglich (wie auf jeder anderen
         Seite), ohne dass 404.html eine Sonderbehandlung in header.js
         bräuchte. -->
    <base href="/">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css?v=2.2">
    <link rel="stylesheet" href="css/header.css?v=2.3">
    <link rel="stylesheet" href="css/glow-page.css">
    <!-- FontAwesome für Social Media & UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Kein eigener Google-Fonts-Import mehr nötig: style.css lädt Anton/
         Barlow Condensed/Inter bereits zentral, und diese Seite nutzt
         ausschliesslich Klassen (.btn, .error-code, ...), die Barlow
         Condensed/Anton verwenden – kein Inter-Text auf dieser Seite. -->

    <!-- Header & Footer via JavaScript einbinden -->
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/header.js" defer></script>
    <!-- Hell-Modus (greift nur bei html[data-theme="light"], siehe theme.css) -->
    <link rel="stylesheet" href="css/theme.css?v=1.8">
</head>
<body class="glow-page">

    <!-- 404 Fehlerbereich (Header & Footer werden durch header.js automatisch eingefügt) -->
    <main class="error-page glow-hero">
        <div class="error-container">
            <span class="error-code">404</span>
            <h1>Seite nicht gefunden</h1>
            <p>Die Seite, die du aufrufen wolltest, existiert leider nicht, wurde verschoben oder die Webadresse ist nicht korrekt.</p>
            
            <div class="error-actions">
                <a href="index.html#home" class="btn">Zurück zur Startseite</a>
            </div>
        </div>
    </main>

</body>
</html>
